<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | СтройПомощь</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body.order-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Декоративная фоновая сетка */
        body.order-page::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(-5deg);
            pointer-events: none;
        }

        .order-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .order-card:hover {
            box-shadow: 0 35px 70px -10px rgba(0, 0, 0, 0.6), 0 0 40px rgba(249, 115, 22, 0.1);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .order-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .order-header p {
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper input,
        .input-wrapper select,
        .input-wrapper textarea {
            width: 100%;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .input-wrapper select option {
            background: #0f172a;
            color: #ffffff;
        }

        .input-wrapper textarea {
            resize: vertical;
            min-height: 90px;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus,
        .input-wrapper textarea:focus {
            border-color: #f97316;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(249, 115, 22, 0.5);
        }

        .order-footer {
            text-align: center;
            margin-top: 20px;
        }

        .back-link {
            font-size: 14px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #f97316;
            text-decoration: underline;
        }

        .success-alert {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.4);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 25px;
    animation: fadeIn 0.4s ease-out;
}

.alert-icon {
    width: 36px;
    height: 36px;
    background: #22c55e;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.alert-content h4 {
    margin: 0 0 4px 0;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
}

.alert-content p {
    margin: 0;
    color: #a1a1aa;
    font-size: 14px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body class="order-page">

    <div class="order-card">
        <div class="brand-header">
            <a href="{{ url_for('main') }}" class="logo-box">
                <div class="logo-icon">🏗️</div>
                <span class="logo-title">СтройПомощь</span>
            </a>
            <div class="order-header">
                <h1>Оформление заказа</h1>
                <p>Заполните форму, и мы свяжемся с вами в течение 15 минут</p>
            </div>
        </div>

        <form action="{{ url_for('order') }}" method="POST">
            
            <div class="form-group">
                <label for="service">Выберите услугу</label>
                <div class="input-wrapper">
                    <select id="service" name="service" required>
                        <option value="Проектирование чертежей">Проектирование чертежей (от 10 000 руб.)</option>
                        <option value="Технический надзор">Технический надзор (от 3 000 руб.)</option>
                        <option value="Консультация по материалам">Консультация по материалам (от 1 500 руб.)</option>
                        <option value="Составление сметы">Составление сметы (от 5 000 руб.)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="name">Ваше имя</label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Почта Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="111@gmail.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Комментарий к заказу (необязательно)</label>
                <div class="input-wrapper">
                    <textarea id="comment" name="comment" placeholder="Расскажите немного о вашем объекте или задаче..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">Подтвердить заказ</button>
        </form>

        <div class="order-footer">
            <a href="{{ url_for('Uslugi') }}" class="back-link">← Вернуться к услугам</a>
        </div>
    </div>
 

{% if success %}
<div class="success-alert">
    <div class="alert-icon">✓</div>
    <div class="alert-content">
        <h4>Заявка успешно отправлена!</h4>
        <p>Наш менеджер свяжется с вами в течение 15 минут.</p>
    </div>
</div>
{% endif %}



</body>
</html>
